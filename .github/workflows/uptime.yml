# Outside-in check of outlink.my, every 5 minutes, from GitHub's servers (not the VPS).
# On failure: (1) our own descriptive email via Resend, if the repo secrets RESEND_API_KEY + ALERT_EMAIL
# are set; (2) GitHub's standard "run failed" email to the repo owner, always (the backup).
# Scheduled runs can start a few minutes late when GitHub is busy.
name: outlink.my uptime (outside check)
run-name: ${{ inputs.drill && 'DRILL - alert email test' || 'outlink.my uptime check' }}
on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "17 3 1 * *"       # monthly keepalive (GitHub pauses schedules in repos idle for 60 days)
  workflow_dispatch:
    inputs:
      drill:
        description: "Fail on purpose, to test that the failure emails arrive"
        type: boolean
        default: false
permissions:
  contents: write   # monthly keepalive commit
  actions: read     # look at earlier runs (outage start / reminder / recovery)
jobs:
  check:
    name: outlink.my reachable from the internet
    if: github.event.schedule != '17 3 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check QR links, QR dashboard and Outlink site (two tries, 30 s apart)
        run: |
          : > problems.txt
          if [ "${{ inputs.drill }}" = "true" ]; then
            echo "DRILL: this is a test of the alert email. outlink.my itself was not checked and is fine." > problems.txt
            echo "::error::$(cat problems.txt)"; exit 1
          fi
          why() {  # curl result -> plain words
            case "$1" in
              000*) echo "no response at all (server down, network or DNS problem, or timed out after 15 s)" ;;
              502*|504*) echo "HTTP ${1%% *}: nginx is up but the app behind it isn't answering" ;;
              5*) echo "HTTP ${1%% *}: server error" ;;
              *) echo "HTTP ${1%% *}${1#* }" ;;
            esac
          }
          check() {
            : > problems.txt
            out=$(curl -s -o /dev/null -m 15 -w '%{http_code} %{redirect_url}' https://outlink.my/q/demo4a2f)
            case "$out" in 30[1278]\ https://outlink.my/*) ;; *)
              echo "PRINTED QR LINKS NOT REDIRECTING: outlink.my/q/demo4a2f gave $(why "$out") (expected a redirect to an outlink.my page). People scanning printed codes are getting an error right now." >> problems.txt ;; esac
            out=$(curl -s -o /dev/null -m 15 -w '%{http_code} %{redirect_url}' https://outlink.my/q/zz-uptime-probe)
            case "$out" in 30[1278]\ */paused) ;; *)
              echo "QR REDIRECT SERVICE UNHEALTHY: an unknown code gave $(why "$out") (expected a redirect to the paused page). The QR app or its database lookup is not working." >> problems.txt ;; esac
            c=$(curl -s -o /dev/null -m 15 -w '%{http_code}' https://outlink.my/qr/login)
            [ "$c" = 200 ] || echo "QR DASHBOARD DOWN: outlink.my/qr/login gave $(why "$c") (expected 200). Clients can't sign in or change their codes." >> problems.txt
            c=$(curl -s -o /dev/null -m 15 -w '%{http_code}' https://outlink.my/)
            [ "$c" = 200 ] || echo "OUTLINK SITE DOWN: outlink.my gave $(why "$c") (expected 200). Client link pages are down." >> problems.txt
            [ ! -s problems.txt ]
          }
          check && exit 0
          sleep 30
          check && exit 0
          while read -r p; do echo "::error::$p"; done < problems.txt
          exit 1
      # Our own email: when an outage starts, hourly while it lasts, and once when it recovers.
      # "How long has it been down" = the unbroken run of failed scheduled checks before this one.
      - name: Email the details (Resend)
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          GH_TOKEN: ${{ github.token }}
          THIS_RUN: ${{ github.run_id }}
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$ALERT_EMAIL" ]; then echo "secrets not set: only GitHub's own email goes out"; exit 0; fi
          drill=$(grep -c '^DRILL' problems.txt 2>/dev/null || true)
          # consecutive failed scheduled checks just before this run
          streak=$(gh run list -R "$GITHUB_REPOSITORY" --workflow uptime.yml --event schedule --status completed -L 30 \
                     --json databaseId,conclusion --jq "[.[] | select(.databaseId != $THIS_RUN)] | .[].conclusion" \
                   | awk '$0=="failure"{n++; next} {exit} END{print n+0}')
          when=$(date -u '+%Y-%m-%d %H:%M UTC')
          if [ "$STATUS" = success ]; then
            [ "$streak" -gt 0 ] || exit 0
            subject="outlink.my RECOVERED (was down about $((streak * 5)) min)"
            body="The outside check passes again as of $when: printed QR links, QR dashboard and Outlink site all answer.

          Down for about $((streak * 5)) minutes ($streak failed checks in a row).
          Run log: $RUN_URL"
          else
            n=$(grep -c . problems.txt || true)
            if [ "$drill" -gt 0 ]; then subject="[DRILL] outlink.my alert email test (nothing is down)"
            else
              # new outage, or an hourly reminder (every 12th failed check)
              [ "$streak" -eq 0 ] || [ $((streak % 12)) -eq 0 ] || { echo "still down, reminder not due (streak $streak)"; exit 0; }
              case "$(head -1 problems.txt)" in
                PRINTED*) what="printed QR codes not redirecting" ;;
                "QR REDIRECT"*) what="QR redirect service unhealthy" ;;
                "QR DASHBOARD"*) what="QR dashboard down" ;;
                *) what="Outlink site down" ;;
              esac
              [ "$n" -ge 3 ] && what="whole site unreachable from outside"
              [ "$streak" -gt 0 ] && what="STILL DOWN after about $((streak * 5)) min: $what"
              subject="outlink.my DOWN: $what"
            fi
            body="Outside check from GitHub, $when (checked twice, 30 s apart):

          $(sed 's/^/- /' problems.txt)

          First checks:
          - Server: ssh -i ~/.ssh/labproof_vps root@187.77.143.45 \"systemctl status outlink-qr outlink nginx --no-pager | head -30\"
          - If the server doesn't answer either: Hostinger hPanel > VPS (is it running?).
          - If the server is up, the on-server monitor emails its own detailed report too.

          Run log: $RUN_URL
          Next: a reminder every hour while it stays down, and one email when it recovers."
          fi
          jq -n --arg from "Outlink monitor <alerts@outlink.my>" --arg to "$ALERT_EMAIL" --arg s "$subject" --arg t "$body" \
            '{from:$from, to:[$to], subject:$s, text:$t}' > mail.json
          curl -fsS -m 20 --retry 2 -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" -H "Content-Type: application/json" --data @mail.json -o /dev/null \
            && echo "emailed: $subject"
  keepalive:
    name: monthly keepalive
    if: github.event.schedule == '17 3 1 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u > .keepalive
          git config user.name "uptime-keepalive"; git config user.email "actions@users.noreply.github.com"
          git add .keepalive && git commit -m "keepalive" && git push
